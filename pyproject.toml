[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telega-cli"
version = "0.1.0"
description = "Terminal Telegram client with vim-like controls and inline images (kitty / sixel)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Axawys", email = "axawys@gmail.com" }]
keywords = ["telegram", "tui", "terminal", "vim", "kitty", "sixel"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "telethon>=1.45",
    "cryptg>=0.5",
    "textual>=8.0",
    "textual-image>=0.14",
    "pillow>=11",
    "av>=14",              # GIF (mp4) и видео-стикеры (webm)
    "rlottie-python>=1.3", # анимированные стикеры (.tgs, Lottie)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Axawys/telegram-cli"
Issues = "https://github.com/Axawys/telegram-cli/issues"

[project.scripts]
telega = "telega.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telega"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B"]
